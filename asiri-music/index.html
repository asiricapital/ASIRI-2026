<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110a">
  <title>Asiri Music OS</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07110a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .boot{max-width:420px;text-align:center}.boot strong{display:block;font-size:24px;margin-bottom:10px}.boot span{color:#9faf9f;line-height:1.8}
  </style>
</head>
<body>
  <div class="boot"><strong>Asiri Music OS</strong><span id="bootStatus">جارٍ تحميل النسخة المستقرة…</span></div>
  <script>
    (async()=>{
      try{
        const response=await fetch('../asiri-music-staging/index.html',{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        let html=await response.text();
        html=html.replace('<head>','<head>\n  <base href="../asiri-music-staging/">');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error('[Asiri Music live loader]',error);
        const status=document.getElementById('bootStatus');
        if(status)status.textContent='تعذر تحميل المنصة الآن. أعد المحاولة بعد لحظات.';
      }
    })();
  </script>
</body>
</html>
