<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Asiri Music</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">مكتبتك الخاصة</p>
        <h1>Asiri Music</h1>
      </div>
      <button id="authButton" class="spotify-button">الدخول عبر Spotify</button>
    </header>

    <section id="profileCard" class="profile-card hidden">
      <img id="profileImage" alt="صورة الحساب" />
      <div>
        <strong id="profileName"></strong>
        <span id="profilePlan"></span>
      </div>
      <button id="logoutButton" class="ghost-button">خروج</button>
    </section>

    <section class="hero-card">
      <div>
        <p class="eyebrow">بحث سريع</p>
        <h2>ابحث عن أغنية أو فنان</h2>
      </div>
      <form id="searchForm" class="search-form">
        <input id="searchInput" type="search" placeholder="مثال: محمد عبده - الأماكن" autocomplete="off" />
        <button type="submit">بحث</button>
      </form>
      <p id="statusText" class="status-text">سجّل الدخول لبدء البحث وإدارة قوائمك.</p>
    </section>

    <section>
      <div class="section-heading">
        <h2>نتائج البحث</h2>
        <span id="resultCount"></span>
      </div>
      <div id="results" class="track-grid"></div>
    </section>

    <section>
      <div class="section-heading">
        <h2>قوائمك</h2>
        <button id="refreshPlaylists" class="text-button">تحديث</button>
      </div>
      <div id="playlists" class="playlist-grid"></div>
    </section>
  </main>

  <template id="trackTemplate">
    <article class="track-card">
      <img class="track-cover" alt="غلاف الأغنية" />
      <div class="track-info">
        <strong class="track-name"></strong>
        <span class="track-artist"></span>
        <span class="track-album"></span>
      </div>
      <div class="track-actions">
        <a class="open-spotify" target="_blank" rel="noopener">فتح في Spotify</a>
        <button class="save-track">حفظ</button>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
