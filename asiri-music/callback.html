<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ربط Spotify</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:28px;text-align:center}p{color:#aaa}</style>
</head>
<body>
  <main><h1>جارٍ ربط Spotify…</h1><p id="message">يرجى الانتظار.</p></main>
  <script type="module">
    const CLIENT_ID = '3163isshqg6ym3o7xracjn4js7ce';
    const redirectUri = window.location.href.split('?')[0];
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const message = document.querySelector('#message');

    if (error) {
      message.textContent = 'تم إلغاء الربط أو رفض الصلاحيات.';
      setTimeout(() => location.href = './', 1800);
    } else if (!code) {
      message.textContent = 'لم يصل رمز التفويض من Spotify.';
    } else {
      const verifier = localStorage.getItem('spotify_code_verifier');
      if (!verifier) {
        message.textContent = 'انتهت جلسة الربط. ارجع وحاول مرة أخرى.';
      } else {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: CLIENT_ID,
            grant_type: 'authorization_code',
            code,
            redirect_uri: redirectUri,
            code_verifier: verifier
          })
        });
        if (!response.ok) {
          message.textContent = 'تعذر إكمال الربط. تحقق من Redirect URI.';
        } else {
          const payload = await response.json();
          localStorage.setItem('spotify_access_token', payload.access_token);
          localStorage.setItem('spotify_expires_at', String(Date.now() + payload.expires_in * 1000 - 60000));
          if (payload.refresh_token) localStorage.setItem('spotify_refresh_token', payload.refresh_token);
          localStorage.removeItem('spotify_code_verifier');
          message.textContent = 'تم الربط بنجاح.';
          setTimeout(() => location.href = './', 700);
        }
      }
    }
  </script>
</body>
</html>
