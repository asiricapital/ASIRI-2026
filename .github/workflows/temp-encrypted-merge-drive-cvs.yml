name: Temporary Encrypted Sharded CV Collection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade 'gdown>=6.0.0' requests

      - name: Download shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          cat > /tmp/collect_shard.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          import gdown
          import requests

          FOLDER_URL = "https://drive.google.com/drive/folders/1oCsuBUGmh6i4uG0aoZiBQqFyb1HDJSeP?usp=sharing"
          EXPECTED = 362
          shard = int(os.environ["SHARD"])
          shards = int(os.environ["SHARDS"])
          output_dir = Path(f"downloaded_cvs_{shard}")
          output_dir.mkdir(parents=True, exist_ok=True)

          listed = subprocess.run(
              ["gdown", FOLDER_URL, "--folder", "--json", "--no-cookies"],
              check=True,
              capture_output=True,
              text=True,
          )
          entries = json.loads(listed.stdout)

          def natural_key(value: str):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r"(\d+)", value)]

          entries = sorted(entries, key=lambda item: natural_key(item["path"]))
          if len(entries) != EXPECTED:
              raise RuntimeError(f"Expected {EXPECTED} entries, found {len(entries)}")
          selected = entries[shard::shards]
          print(f"SHARD={shard} SELECTED={len(selected)}")

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 Chrome/126 Safari/537.36"})

          def file_id(url: str) -> str:
              parsed = urlparse(url)
              values = parse_qs(parsed.query).get("id")
              if values:
                  return values[0]
              match = re.search(r"/d/([^/]+)", parsed.path)
              return match.group(1) if match else url

          def valid(path: Path) -> bool:
              try:
                  with path.open("rb") as handle:
                      return path.stat().st_size > 1000 and handle.read(5) == b"%PDF-"
              except OSError:
                  return False

          def direct(fid: str, dest: Path) -> bool:
              for url in (
                  f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t",
                  f"https://drive.google.com/uc?export=download&id={fid}&confirm=t",
              ):
                  try:
                      res = session.get(url, timeout=45, allow_redirects=True)
                      if res.status_code == 200 and res.content[:5] == b"%PDF-":
                          dest.write_bytes(res.content)
                          return valid(dest)
                  except requests.RequestException:
                      pass
              return False

          records = []
          failed = []
          for position, entry in enumerate(selected, start=1):
              name = Path(entry["path"]).name
              dest = output_dir / name
              fid = file_id(entry["url"])
              ok = False
              error = None
              for attempt in range(2):
                  try:
                      if dest.exists():
                          dest.unlink()
                      gdown.download(url=entry["url"], output=str(dest), quiet=True, use_cookies=False)
                      if valid(dest):
                          ok = True
                          break
                  except Exception as exc:
                      error = f"{type(exc).__name__}: {exc}"
                  if direct(fid, dest):
                      ok = True
                      break
                  time.sleep(4)
              rec = {
                  "global_index": entries.index(entry) + 1,
                  "id": fid,
                  "url": entry["url"],
                  "path": name,
                  "downloaded": ok,
                  "error": error,
              }
              records.append(rec)
              if not ok:
                  failed.append(rec)
              print(f"[{position}/{len(selected)}] {'OK' if ok else 'FAILED'} {name}")
              time.sleep(0.15)

          manifest = {
              "expected_total": EXPECTED,
              "shard": shard,
              "shards": shards,
              "selected": len(selected),
              "downloaded": len(selected) - len(failed),
              "failed": failed,
              "files": records,
          }
          Path(f"manifest_{shard}.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"SHARD_{shard}_FAILED={len(failed)}")
          PY
          python /tmp/collect_shard.py
          tar -czf "collected_cvs_${SHARD}.tar.gz" "downloaded_cvs_${SHARD}" "manifest_${SHARD}.json"

      - name: Encrypt shard archive
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo '' | base64 -d > public.pem
          openssl rand 32 > "key_${SHARD}.bin"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "collected_cvs_${SHARD}.tar.gz" \
            -out "collected_cvs_${SHARD}.tar.gz.enc" \
            -pass file:"key_${SHARD}.bin"
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -in "key_${SHARD}.bin" -out "key_${SHARD}.enc" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum "collected_cvs_${SHARD}.tar.gz" > "archive_${SHARD}.sha256"
          rm -rf "downloaded_cvs_${SHARD}" "manifest_${SHARD}.json" "collected_cvs_${SHARD}.tar.gz" "key_${SHARD}.bin" public.pem

      - name: Upload encrypted shard
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-cv-shard-${{ matrix.shard }}
          path: |
            collected_cvs_${{ matrix.shard }}.tar.gz.enc
            key_${{ matrix.shard }}.enc
            archive_${{ matrix.shard }}.sha256
          if-no-files-found: error
          retention-days: 1
